<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Lab</title>
  <link rel="stylesheet" href="ds/styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Figma: Content Lab / Initial (node 17042:14417) -->
  <main class="app-initial">
    <button class="ds-btn ds-btn-md ds-btn-primary" id="open-content-lab">
      <ds-icon name="gen-ai" size="24"></ds-icon>
      Content lab
    </button>
  </main>

  <!-- Content Lab drawer (Figma node 17050:14827) -->
  <div class="app-drawer" id="content-lab-drawer" aria-hidden="true">
    <div class="app-drawer-overlay" data-drawer-close></div>

    <!-- Summary preview, fills the space left of the drawer (Figma node 2817:7813) -->
    <section class="app-pv" id="summary-preview" aria-labelledby="pv-title" hidden>
      <header class="app-pv-header">
        <button class="app-icon-btn-on-dark app-pv-close" data-pv-mode="summary" data-preview-close aria-label="Close preview"><ds-icon name="clear"></ds-icon></button>
        <button class="app-icon-btn-on-dark app-pv-close" data-pv-mode="clips" data-pv-go="summary" aria-label="Back" hidden><ds-icon name="chevron-left"></ds-icon></button>
        <button class="app-icon-btn-on-dark app-pv-close" data-pv-mode="trim" data-pv-go="clips" aria-label="Back" hidden><ds-icon name="chevron-left"></ds-icon></button>
        <h2 class="app-pv-title" id="pv-title"></h2>
      </header>

      <!-- Mode: trim a chapter into a clip (reference: Figma node 658:3373) -->
      <div class="app-pv-main app-pv-main-trim" data-pv-mode="trim" hidden>
        <div class="app-pv-tiles">
          <button class="app-pv-tile" data-pv-go="clips"><ds-icon name="clear"></ds-icon>Cancel</button>
          <button class="app-pv-tile app-pv-tile-primary" data-trim-create><ds-icon name="check"></ds-icon>Create clip</button>
        </div>

        <div class="app-trim-stage">
          <div class="app-player app-player-md">
            <img class="app-player-still" id="trim-still" src="assets/video-still.jpg" alt="">
            <div class="app-player-video">
              <div></div>
              <div class="app-player-bottom">
                <div class="app-player-progress"><span id="trim-progress"></span></div>
                <div class="app-player-controls">
                  <button class="app-player-ctrl" aria-label="Pause"><img src="assets/player-pause.svg" alt="" width="32" height="32"></button>
                  <span class="app-player-time" id="trim-player-time"></span>
                  <span class="app-player-spacer"></span>
                  <button class="app-player-ctrl" aria-label="Volume"><img src="assets/player-volume.svg" alt="" width="35.1" height="32"></button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="app-trim-tools">
          <span class="app-trim-time" id="trim-time"></span>
          <button class="app-trim-play" aria-label="Play"><ds-icon name="play"></ds-icon></button>
          <button class="app-text-btn-on-dark" data-trim-to-cti><ds-icon name="trim"></ds-icon>Trim to current time</button>
        </div>

        <div class="app-trim" id="trimmer">
          <div class="app-trim-range" id="trim-range"><span class="app-trim-len" id="trim-len"></span></div>
          <span class="app-trim-handle" data-trim="start" role="slider" aria-label="Clip start"></span>
          <span class="app-trim-handle" data-trim="end" role="slider" aria-label="Clip end"></span>
          <span class="app-trim-cti" data-trim="cti" aria-label="Current time"></span>
        </div>
      </div>

      <!-- Mode: create clips from chapters (Figma node 17052:26744) -->
      <div class="app-pv-main" data-pv-mode="clips" hidden>
        <div class="app-player app-player-sm">
          <!-- Second real Kaltura player, set up by app.js when this mode opens -->
          <div class="app-player-embed" id="kaltura-player-clips"></div>
        </div>
        <div class="app-clip-list" id="pv-clip-list"></div>
      </div>


      <!-- Mode: summary preview -->
      <div class="app-pv-main" data-pv-mode="summary">
        <div class="app-pv-tiles">
          <button class="app-pv-tile"><ds-icon name="edit"></ds-icon>Edit summary</button>
          <button class="app-pv-tile" data-pv-go="clips"><ds-icon name="clips"></ds-icon>Create clips</button>
        </div>

        <div class="app-player">
          <!-- Real Kaltura player, set up by app.js on first open -->
          <div class="app-player-embed" id="kaltura-player"></div>

          <aside class="app-sink">
            <div class="app-sink-header">
              <div class="app-sink-top">
                <span class="app-sink-title">Summary &amp; chapters</span>
                <button class="app-icon-btn-on-dark" aria-label="Close"><ds-icon name="clear"></ds-icon></button>
              </div>
              <div class="app-sink-actions">
                <button class="app-sink-chip">Read as overview</button>
                <button class="app-icon-btn-on-dark app-icon-btn-on-dark-sm" aria-label="Copy"><ds-icon name="copy" size="16"></ds-icon></button>
              </div>
            </div>
            <p class="app-sink-summary" id="pv-summary"></p>
            <div id="pv-chapters"></div>
          </aside>
        </div>

        <div class="app-pv-feedback">
          <button class="app-icon-btn-on-dark" aria-label="Like"><ds-icon name="like-hollow"></ds-icon></button>
          <button class="app-icon-btn-on-dark" aria-label="Dislike"><ds-icon name="dislike-hollow"></ds-icon></button>
        </div>
      </div>

      <footer class="app-pv-footer" data-pv-mode="summary">
        <button class="app-pv-btn-dark">Delete draft</button>
        <button class="ds-btn ds-btn-lg ds-btn-primary">Publish to media</button>
      </footer>
    </section>

    <div class="app-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="content-lab-title">
      <button class="app-icon-btn-on-dark app-drawer-close" data-drawer-close aria-label="Close"><ds-icon name="clear"></ds-icon></button>
      <!-- View: Content Lab menu -->
      <div class="app-drawer-body" data-view="menu">
        <div class="app-cl-hero">
          <img src="assets/illustration.svg" alt="" width="580" height="300">
        </div>
        <h2 class="app-cl-title" id="content-lab-title">Get more from your video</h2>
        <div class="app-cl-sections" id="content-lab-sections"></div>
        <p class="app-cl-disclaimer">AI-generated content may contain errors or omissions. Please review before use.</p>
      </div>

      <!-- View: Summary & chapters (Figma node 17050:26453) -->
      <div class="app-drawer-body" data-view="summary" hidden>
        <div class="app-view-header">
          <button class="ds-btn ds-btn-md ds-btn-secondary ds-btn-borderless ds-btn-icon" data-go-view="menu" aria-label="Back"><ds-icon name="chevron-left"></ds-icon></button>
          <h2 class="app-view-title">Summary &amp; chapters</h2>
        </div>
        <div class="app-view-actions">
          <button class="ds-btn ds-btn-lg ds-btn-primary">Generate new</button>
        </div>
        <div class="app-view-list">
          <p class="app-view-separator">Drafts</p>
          <div id="summary-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="ds/ds-icons.js"></script>
  <script src="ds/ds.js"></script>
  <script src="https://cdnapisec.kaltura.com/p/1912501/embedPlaykitJs/uiconf_id/57496443"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
